[project]
name = "sql-migration-ai"
version = "0.1.0"
description = "MySQL SQL을 PostgreSQL SQL로 변환하고 정확성·성능을 검증하는 학습용 도구"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
